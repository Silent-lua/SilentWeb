<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Drama — Roy Woods</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
  background:#0a0a2e;
  font-family:Inter,system-ui,-apple-system,sans-serif;
}
#stage{
  position:fixed;inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#05051a;
  overflow:hidden;
}
#coverWrap{
  position:relative;
  width:min(92vw, 520px);
  aspect-ratio:1/1;
  transform-origin:center center;
  will-change:transform, filter;
}
#cover{
  width:100%;height:100%;
  object-fit:cover;
  border-radius:4px;
  display:block;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 20px 60px rgba(0,0,0,0.55),
    0 0 80px rgba(40,60,140,0.25);
}
#glow{
  position:absolute;
  inset:-18%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(100,140,255,0.22) 0%, rgba(40,60,160,0.08) 40%, transparent 70%);
  pointer-events:none;
  z-index:-1;
  filter:blur(8px);
  opacity:0.7;
}
#moonPulse{
  position:absolute;
  top:11%;
  right:12%;
  width:14%;
  height:14%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,240,160,0.55) 0%, rgba(255,220,100,0.15) 45%, transparent 70%);
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:0.4;
}
#sweep{
  position:absolute;
  inset:0;
  border-radius:4px;
  background:linear-gradient(
    115deg,
    transparent 0%,
    transparent 40%,
    rgba(255,255,255,0.04) 48%,
    rgba(255,255,255,0.09) 50%,
    rgba(255,255,255,0.04) 52%,
    transparent 60%,
    transparent 100%
  );
  background-size:200% 200%;
  pointer-events:none;
  opacity:0;
  mix-blend-mode:overlay;
}
#fx{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  border-radius:4px;
  pointer-events:none;
}
.vignette{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:5;
  background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
}
.noise{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:6;
  opacity:0.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:160px 160px;
}
.ui{
  position:fixed;inset:0;
  z-index:20;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:max(48px, env(safe-area-inset-bottom));
}
.title{
  font-size:11px;
  letter-spacing:0.45em;
  text-transform:uppercase;
  color:rgba(220,230,255,0.55);
  margin-bottom:6px;
  opacity:0;
  transition:opacity 1s ease;
}
.title.show{opacity:1}
.artist{
  font-size:10px;
  letter-spacing:0.3em;
  text-transform:uppercase;
  color:rgba(160,180,220,0.4);
  margin-bottom:28px;
  opacity:0;
  transition:opacity 1s ease 0.15s;
}
.artist.show{opacity:1}
.play-btn{
  pointer-events:auto;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(180,200,255,0.22);
  color:rgba(220,230,255,0.9);
  font-size:11px;
  letter-spacing:0.35em;
  text-transform:uppercase;
  padding:14px 36px;
  border-radius:40px;
  cursor:pointer;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  transition:background 0.3s, border-color 0.3s, transform 0.2s, opacity 0.6s;
}
.play-btn:hover{
  background:rgba(120,160,255,0.15);
  border-color:rgba(180,210,255,0.4);
}
.play-btn:active{transform:scale(0.97)}
.play-btn.hidden{
  opacity:0;
  pointer-events:none;
}
.hint{
  margin-top:14px;
  font-size:9px;
  letter-spacing:0.25em;
  text-transform:uppercase;
  color:rgba(140,160,200,0.35);
  opacity:0;
  transition:opacity 0.8s;
}
.hint.show{opacity:1}
.hint.hidden{opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="coverWrap">
    <div id="glow"></div>
    <img id="cover" src="./cover.jpg" alt="Roy Woods — Drama" draggable="false">
    <div id="moonPulse"></div>
    <div id="sweep"></div>
    <canvas id="fx"></canvas>
  </div>
</div>
<div class="vignette"></div>
<div class="noise"></div>
<div class="ui">
  <div class="title" id="title">Drama</div>
  <div class="artist" id="artist">Roy‐Woods (Feat. Drake)</div>
  <button class="play-btn" id="playBtn">PLAY</button>
  <div class="hint" id="hint">Owner • Silent</div>
</div>

<script>
(() => {
"use strict";

const CONFIG = {
  AUDIO_FILE: "./drama.mp3",
  COVER_FILE: "./cover.jpg",
  AUDIO_START: 156,
  AUDIO_DURATION: 33
};

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const TAU = Math.PI * 2;

class AudioEngine {
  constructor() {
    this.audio = null;
    this.ctx = null;
    this.analyser = null;
    this.freq = null;
    this.wave = null;
    this.bass = 0; this.mids = 0; this.treble = 0;
    this.energy = 0; this.beat = 0;
    this.sBass = 0; this.sMids = 0; this.sTreble = 0; this.sEnergy = 0;
    this.prevEnergy = 0; this.beatHold = 0;
    this.playing = false;
    this.ready = false;
  }

  async init() {
    if (this.ready) return true;
    try {
      this.audio = new Audio(CONFIG.AUDIO_FILE);
      this.audio.preload = "auto";
      this.audio.loop = false;

      await new Promise((res, rej) => {
        this.audio.addEventListener("canplaythrough", res, { once: true });
        this.audio.addEventListener("error", () => rej(new Error("audio missing")), { once: true });
        this.audio.load();
        setTimeout(() => rej(new Error("timeout")), 10000);
      });

      this.audio.currentTime = CONFIG.AUDIO_START;

      this.audio.addEventListener("timeupdate", () => {
        if (!this.playing) return;
        if (this.audio.currentTime >= CONFIG.AUDIO_START + CONFIG.AUDIO_DURATION) {
          this.audio.currentTime = CONFIG.AUDIO_START;
        }
      });
      this.audio.addEventListener("ended", () => {
        if (this.playing) {
          this.audio.currentTime = CONFIG.AUDIO_START;
          this.audio.play().catch(()=>{});
        }
      });

      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 512;
      this.analyser.smoothingTimeConstant = 0.75;
      this.analyser.minDecibels = -72;
      this.analyser.maxDecibels = -18;

      const src = this.ctx.createMediaElementSource(this.audio);
      src.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);

      this.freq = new Uint8Array(this.analyser.frequencyBinCount);
      this.wave = new Uint8Array(this.analyser.fftSize);
      this.ready = true;
      return true;
    } catch (e) {
      console.warn(e);
      return false;
    }
  }

  async play() {
    if (!this.ready) {
      const ok = await this.init();
      if (!ok) return false;
    }
    if (this.ctx.state === "suspended") await this.ctx.resume();
    this.audio.currentTime = CONFIG.AUDIO_START;
    try {
      await this.audio.play();
      this.playing = true;
      return true;
    } catch {
      return false;
    }
  }

  update() {
    if (!this.ready || !this.playing) {
      this.sBass *= 0.94; this.sMids *= 0.94;
      this.sTreble *= 0.94; this.sEnergy *= 0.94;
      this.beat *= 0.88;
      return;
    }
    this.analyser.getByteFrequencyData(this.freq);
    this.analyser.getByteTimeDomainData(this.wave);

    let b=0, m=0, t=0;
    for (let i=1; i<7; i++) b += this.freq[i];
    for (let i=7; i<48; i++) m += this.freq[i];
    for (let i=48; i<160; i++) t += this.freq[i];

    this.bass = clamp(b / (6*255), 0, 1);
    this.mids = clamp(m / (41*255), 0, 1);
    this.treble = clamp(t / (112*255), 0, 1);

    let we = 0;
    for (let i=0; i<this.wave.length; i++) {
      const v = (this.wave[i]-128)/128;
      we += v*v;
    }
    we = Math.sqrt(we / this.wave.length);
    this.energy = clamp(this.bass*0.5 + this.mids*0.28 + we*0.4, 0, 1);

    this.sBass = lerp(this.sBass, this.bass, 0.2);
    this.sMids = lerp(this.sMids, this.mids, 0.16);
    this.sTreble = lerp(this.sTreble, this.treble, 0.22);
    this.sEnergy = lerp(this.sEnergy, this.energy, 0.18);

    const d = this.energy - this.prevEnergy;
    if (d > 0.11 && this.energy > 0.36 && this.beatHold <= 0) {
      this.beat = 1;
      this.beatHold = 9;
    } else {
      this.beat *= 0.8;
    }
    if (this.beatHold > 0) this.beatHold--;
    this.prevEnergy = this.energy;
  }
}

class Dust {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.particles = [];
    this.w = 0; this.h = 0;
    this.resize();
    for (let i=0; i<55; i++) this.particles.push(this.spawn());
  }
  resize() {
    const rect = this.canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    this.w = rect.width || 400;
    this.h = rect.height || 400;
    this.canvas.width = this.w * dpr;
    this.canvas.height = this.h * dpr;
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  spawn() {
    return {
      x: Math.random() * this.w,
      y: Math.random() * this.h,
      r: 0.4 + Math.random() * 1.4,
      a: 0.08 + Math.random() * 0.25,
      vx: (Math.random()-0.5)*0.15,
      vy: (Math.random()-0.5)*0.12 - 0.05,
      phase: Math.random() * TAU
    };
  }
  update(audio, dt) {
    const boost = 1 + audio.sEnergy * 1.5 + audio.beat * 0.8;
    for (const p of this.particles) {
      p.x += p.vx * boost * dt * 0.04;
      p.y += p.vy * boost * dt * 0.04;
      p.phase += 0.02;
      if (p.x < -5) p.x = this.w + 5;
      if (p.x > this.w + 5) p.x = -5;
      if (p.y < -5) p.y = this.h + 5;
      if (p.y > this.h + 5) p.y = -5;
    }
  }
  draw(audio) {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, this.w, this.h);
    const energy = audio.sEnergy;
    for (const p of this.particles) {
      const pulse = 0.6 + Math.sin(p.phase) * 0.4;
      const alpha = p.a * pulse * (0.5 + energy * 0.9 + audio.beat * 0.4);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 + energy * 0.5), 0, TAU);
      ctx.fillStyle = "rgba(200,220,255," + alpha + ")";
      ctx.fill();
    }
  }
}

class App {
  constructor() {
    this.audio = new AudioEngine();
    this.coverWrap = document.getElementById("coverWrap");
    this.glow = document.getElementById("glow");
    this.moon = document.getElementById("moonPulse");
    this.sweep = document.getElementById("sweep");
    this.playBtn = document.getElementById("playBtn");
    this.hint = document.getElementById("hint");
    this.title = document.getElementById("title");
    this.artist = document.getElementById("artist");
    this.fx = document.getElementById("fx");
    this.dust = new Dust(this.fx);

    this.rotX = 0; this.rotY = 0;
    this.targetRotX = 0; this.targetRotY = 0;
    this.scale = 1;
    this.sweepPos = 0;
    this.last = 0;

    this.playBtn.addEventListener("click", () => this.start());

    window.addEventListener("resize", () => this.dust.resize());
    window.addEventListener("pointermove", (e) => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      this.targetRotY = nx * 4;
      this.targetRotX = -ny * 3;
    });

    setTimeout(() => {
      this.title.classList.add("show");
      this.artist.classList.add("show");
      this.hint.classList.add("show");
    }, 400);

    requestAnimationFrame((t) => this.loop(t));
  }

  async start() {
    this.playBtn.textContent = "…";
    this.playBtn.disabled = true;
    const ok = await this.audio.play();
    if (ok) {
      this.playBtn.classList.add("hidden");
      this.hint.classList.remove("show");
      this.hint.classList.add("hidden");
    } else {
      this.playBtn.textContent = "AUDIO ERROR";
      this.playBtn.disabled = false;
      setTimeout(() => { this.playBtn.textContent = "RETRY"; }, 2000);
    }
  }

  loop(time) {
    const dt = Math.min(time - this.last, 32);
    this.last = time;

    this.audio.update();
    const a = this.audio;

    const pulse = 1 + a.sBass * 0.035 + a.beat * 0.04 + a.sEnergy * 0.015;
    this.scale = lerp(this.scale, pulse, 0.18);

    this.rotX = lerp(this.rotX, this.targetRotX + Math.sin(time*0.0004)*1.2, 0.06);
    this.rotY = lerp(this.rotY, this.targetRotY + Math.cos(time*0.0003)*1.0, 0.06);

    this.coverWrap.style.transform =
      "perspective(900px) rotateX(" + this.rotX + "deg) rotateY(" + this.rotY + "deg) scale(" + this.scale + ")";

    const glowOp = 0.45 + a.sEnergy * 0.55 + a.beat * 0.35;
    this.glow.style.opacity = glowOp;
    this.glow.style.transform = "scale(" + (1 + a.sBass * 0.15 + a.beat * 0.1) + ")";

    this.moon.style.opacity = 0.25 + a.sTreble * 0.45 + a.beat * 0.35;
    this.moon.style.transform = "scale(" + (1 + a.sTreble * 0.25 + a.beat * 0.2) + ")";

    if (a.beat > 0.7 || a.sEnergy > 0.55) {
      this.sweep.style.opacity = 0.5 + a.sEnergy * 0.4;
    } else {
      const cur = parseFloat(this.sweep.style.opacity || "0") || 0;
      this.sweep.style.opacity = lerp(cur, 0.08, 0.05);
    }
    this.sweepPos = (this.sweepPos + 0.15 + a.sMids * 0.4) % 100;
    this.sweep.style.backgroundPosition = this.sweepPos + "% 50%";

    const brightness = 1 + a.sEnergy * 0.08 + a.beat * 0.06;
    const contrast = 1 + a.sBass * 0.05;
    this.coverWrap.style.filter = "brightness(" + brightness + ") contrast(" + contrast + ")";

    this.dust.update(a, dt);
    this.dust.draw(a);

    requestAnimationFrame((t) => this.loop(t));
  }
}

window.addEventListener("load", () => new App());
})();
</script>
</body>
</html>
